name: PR Governance

# PR の Self Review 記入を強制する（DevConst ⑫ / EP-13 完了条件:
# 「Self Review 記入欄が自動で現れ、未記入だと通らない」）。
# ドラフト PR は対象外（作業中は許容）。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  self-review:
    name: Self Review 記入チェック
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: PR 本文に Self Review が記入されているか
        # 本文はスクリプトへ env 経由で渡す（コマンドインジェクション回避）。
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "::error::PR 本文が空です。テンプレートの Self Review を記入してください。"
            exit 1
          fi
          if ! printf '%s' "$PR_BODY" | grep -q "Self Review"; then
            echo "::error::Self Review セクションがありません。PR テンプレートを使ってください。"
            exit 1
          fi
          if ! printf '%s' "$PR_BODY" | grep -qiF '[x]'; then
            echo "::error::Self Review のチェックが1つも入っていません。自己レビュー結果を記入してください（DevConst ⑫）。"
            exit 1
          fi
          echo "OK: Self Review の記入を確認しました。"
